<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="css/style.css">
    <title>Memory Gallery</title>
</head>
<body>
<main class="app">
    <header class="app-header">
        <div class="header-content">
            <h1 class="app-title">
                <span>Memory</span>
                <span>Gallery</span>
            </h1>
            <div class="header-actions">
                <button class="button" id="new-game" type="button">New Game</button>
                <button class="button button--secondary" id="leaderboard-button" type="button">Leaderboard</button>
            </div>
        </div>
        <div class="stats" aria-live="polite">
            <p id="moves-counter">Moves: 0</p>
            <img src="assets/images/star.svg" class="stats-separator" aria-hidden="true" alt="">
            <p id="pairs-counter">Pairs: 0 / 8</p>
        </div>
    </header>

    <section class="board" aria-label="Memory game cards">
        <button class="card" type="button" data-image="1" aria-label="Reveal card 1">
            <img class="card__back" src="./assets/images/card%20back.jpg" alt="" draggable="false">
            <img class="card__front" src="./assets/images/1.jpg" alt="" draggable="false">
        </button>
        <button class="card" type="button" data-image="2" aria-label="Reveal card 2">
            <img class="card__back" src="./assets/images/card%20back.jpg" alt="" draggable="false">
            <img class="card__front" src="./assets/images/2.jpg" alt="" draggable="false">
        </button>
        <button class="card" type="button" data-image="3" aria-label="Reveal card 3">
            <img class="card__back" src="./assets/images/card%20back.jpg" alt="" draggable="false">
            <img class="card__front" src="./assets/images/3.jpg" alt="" draggable="false">
        </button>
        <button class="card" type="button" data-image="4" aria-label="Reveal card 4">
            <img class="card__back" src="./assets/images/card%20back.jpg" alt="" draggable="false">
            <img class="card__front" src="./assets/images/4.jpg" alt="" draggable="false">
        </button>
        <button class="card" type="button" data-image="5" aria-label="Reveal card 5">
            <img class="card__back" src="./assets/images/card%20back.jpg" alt="" draggable="false">
            <img class="card__front" src="./assets/images/5.jpg" alt="" draggable="false">
        </button>
        <button class="card" type="button" data-image="6" aria-label="Reveal card 6">
            <img class="card__back" src="./assets/images/card%20back.jpg" alt="" draggable="false">
            <img class="card__front" src="./assets/images/6.jpg" alt="" draggable="false">
        </button>
        <button class="card" type="button" data-image="7" aria-label="Reveal card 7">
            <img class="card__back" src="./assets/images/card%20back.jpg" alt="" draggable="false">
            <img class="card__front" src="./assets/images/7.jpg" alt="" draggable="false">
        </button>
        <button class="card" type="button" data-image="8" aria-label="Reveal card 8">
            <img class="card__back" src="./assets/images/card%20back.jpg" alt="" draggable="false">
            <img class="card__front" src="./assets/images/8.jpg" alt="" draggable="false">
        </button>
        <button class="card" type="button" data-image="1" aria-label="Reveal card 9">
            <img class="card__back" src="./assets/images/card%20back.jpg" alt="" draggable="false">
            <img class="card__front" src="./assets/images/1.jpg" alt="" draggable="false">
        </button>
        <button class="card" type="button" data-image="2" aria-label="Reveal card 10">
            <img class="card__back" src="./assets/images/card%20back.jpg" alt="" draggable="false">
            <img class="card__front" src="./assets/images/2.jpg" alt="" draggable="false">
        </button>
        <button class="card" type="button" data-image="3" aria-label="Reveal card 11">
            <img class="card__back" src="./assets/images/card%20back.jpg" alt="" draggable="false">
            <img class="card__front" src="./assets/images/3.jpg" alt="" draggable="false">
        </button>
        <button class="card" type="button" data-image="4" aria-label="Reveal card 12">
            <img class="card__back" src="./assets/images/card%20back.jpg" alt="" draggable="false">
            <img class="card__front" src="./assets/images/4.jpg" alt="" draggable="false">
        </button>
        <button class="card" type="button" data-image="5" aria-label="Reveal card 13">
            <img class="card__back" src="./assets/images/card%20back.jpg" alt="" draggable="false">
            <img class="card__front" src="./assets/images/5.jpg" alt="" draggable="false">
        </button>
        <button class="card" type="button" data-image="6" aria-label="Reveal card 14">
            <img class="card__back" src="./assets/images/card%20back.jpg" alt="" draggable="false">
            <img class="card__front" src="./assets/images/6.jpg" alt="" draggable="false">
        </button>
        <button class="card" type="button" data-image="7" aria-label="Reveal card 15">
            <img class="card__back" src="./assets/images/card%20back.jpg" alt="" draggable="false">
            <img class="card__front" src="./assets/images/7.jpg" alt="" draggable="false">
        </button>
        <button class="card" type="button" data-image="8" aria-label="Reveal card 16">
            <img class="card__back" src="./assets/images/card%20back.jpg" alt="" draggable="false">
            <img class="card__front" src="./assets/images/8.jpg" alt="" draggable="false">
        </button>
    </section>
</main>

<dialog class="modal" id="leaderboard-modal" data-view="leaderboard" aria-labelledby="leaderboard-title">
    <form class="modal-inner" method="dialog">
        <button class="modal-close" type="submit" aria-label="Close leaderboard">×</button>
        <h2 class="modal-title" id="leaderboard-title">Leaderboard</h2>
        <div class="ornament" aria-hidden="true">✦</div>
        <p class="empty-state">No results yet.</p>
        <table class="leaderboard" hidden>
            <thead>
            <tr><th scope="col">#</th><th scope="col">Moves</th><th scope="col">Date</th></tr>
            </thead>
            <tbody id="leaderboard-results"></tbody>
        </table>
        <div class="modal-actions">
            <button class="button" type="submit">Close</button>
        </div>
    </form>
</dialog>

<dialog class="modal" id="victory-modal" data-view="victory" aria-labelledby="victory-title">
    <form class="modal-inner" method="dialog">
        <button class="modal-close" type="submit" aria-label="Close victory dialog">×</button>
        <h2 class="modal-title" id="victory-title">You Won!</h2>
        <div class="ornament" aria-hidden="true">✦</div>
        <p class="modal-message">All 8 pairs found.</p>
        <p class="modal-message">Total moves: <span id="final-moves">0</span></p>
        <div class="modal-actions">
            <button class="button" id="victory-new-game" type="button">New Game</button>
            <button class="button button--secondary" type="submit">Close</button>
        </div>
    </form>
</dialog>

<script src="js/app.js"></script>
</body>
</html>
